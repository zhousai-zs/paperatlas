name: Tests and packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Install locked CPU dependencies
        run: uv sync --locked --extra dev
      - name: Test synthetic bundles and actual stdio transport
        run: uv run --no-sync pytest -q --junitxml=reports/tests.xml
      - name: Build wheel and source distribution
        run: uv build
      - name: Install the built wheel
        run: uv pip install --reinstall --no-deps --no-index --find-links dist paperatlas==0.2.0
      - name: Verify installed command and version
        run: |
          uv run --no-sync paperatlas --help
          uv run --no-sync python -c "import importlib.metadata, paperatlas; assert paperatlas.__version__ == '0.2.0'; assert importlib.metadata.version('paperatlas') == '0.2.0'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paperatlas-${{ matrix.os }}
          path: |
            reports/tests.xml
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn
