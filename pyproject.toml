[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperatlas"
version = "0.3.0"
description = "Local, traceable retrieval over PaperBridge V1 bundles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "jieba>=0.42.1,<0.43", "markdown-it-py>=3,<5", "sentence-transformers>=3,<6", "mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "psutil>=6,<8"]

[project.scripts]
paperatlas = "paperatlas.cli:main"

[project.urls]
Repository = "https://github.com/zhousai-zs/paperatlas"
Issues = "https://github.com/zhousai-zs/paperatlas/issues"

[tool.hatch.build.targets.wheel.force-include]
"src/paperatlas/static/index.html" = "paperatlas/static/index.html"

[tool.hatch.build.targets.sdist.force-include]
"src/paperatlas/static/index.html" = "src/paperatlas/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.cache/pytest"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
